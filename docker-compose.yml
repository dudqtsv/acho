version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_lab
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: banco
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./banco:/docker-entrypoint-initdb.d

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_apache_lab
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./html:/var/www/html
      - ./fotos:/var/www/html/fotos
    depends_on:
      - db

volumes:
  db_data:
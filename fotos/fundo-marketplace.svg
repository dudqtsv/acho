<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B44"/>
      <stop offset="1" stop-color="#112A66"/>
    </linearGradient>

    <!-- ícones de contorno -->
    <g id="cart" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 10h14l10 50h50l9-36H24"/><circle cx="36" cy="76" r="6"/><circle cx="72" cy="76" r="6"/>
    </g>
    <g id="bag" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 30h70l-6 60H21z"/><path d="M35 30v-8a15 15 0 0 1 30 0v8"/>
    </g>
    <g id="tag" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 10h40l40 40-40 40L10 50z"/><circle cx="30" cy="30" r="5"/>
    </g>
    <g id="box" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 30l40-20 40 20v45L50 95 10 75z"/><path d="M10 30l40 20 40-20M50 50v45"/>
    </g>
    <g id="heart" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 85C10 55 15 20 38 20c8 0 12 5 12 10 0-5 4-10 12-10 23 0 28 35-12 65z"/>
    </g>
    <g id="star" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 8l13 27 29 4-21 21 5 29-26-14-26 14 5-29L8 39l29-4z"/>
    </g>

    <!-- pessoa (silhueta) com sacola -->
    <g id="person">
      <circle cx="40" cy="22" r="16"/>
      <path d="M10 120V75a30 30 0 0 1 60 0v45z"/>
    </g>
    <g id="bagf">
      <path d="M15 30h70l-6 60H21z" fill="#4C7DF0"/>
      <path d="M35 30v-8a15 15 0 0 1 30 0v8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- círculos suaves -->
  <circle cx="1650" cy="150" r="330" fill="#fff" opacity="0.04"/>
  <circle cx="200" cy="260" r="260" fill="#fff" opacity="0.035"/>
  <circle cx="1000" cy="1180" r="420" fill="#fff" opacity="0.04"/>

  <!-- ícones espalhados (discretos, para não atrapalhar o conteúdo) -->
  <g opacity="0.13">
    <use href="#cart" transform="translate(90 70) scale(1.3) rotate(-8 50 50)"/>
    <use href="#bag" transform="translate(420 150) scale(1.1) rotate(10 50 50)"/>
    <use href="#tag" transform="translate(760 60) scale(1.0) rotate(-12 50 50)"/>
    <use href="#box" transform="translate(1080 130) scale(1.2) rotate(8 50 50)"/>
    <use href="#heart" transform="translate(1380 60) scale(1.0) rotate(-6 50 50)"/>
    <use href="#cart" transform="translate(1640 330) scale(1.4) rotate(6 50 50)"/>
    <use href="#star" transform="translate(1780 90) scale(0.9)"/>
    <use href="#tag" transform="translate(60 420) scale(1.2) rotate(14 50 50)"/>
    <use href="#box" transform="translate(300 520) scale(1.0) rotate(-10 50 50)"/>
    <use href="#heart" transform="translate(1520 560) scale(1.1) rotate(10 50 50)"/>
    <use href="#bag" transform="translate(1790 640) scale(1.0) rotate(-8 50 50)"/>
    <use href="#star" transform="translate(130 700) scale(0.9)"/>
    <use href="#cart" transform="translate(620 300) scale(0.9) rotate(-10 50 50)"/>
    <use href="#bag" transform="translate(1260 330) scale(0.9) rotate(8 50 50)"/>
  </g>

  <!-- pessoas ao fundo (mais discretas) -->
  <g fill="#fff" opacity="0.28">
    <use href="#person" transform="translate(330 1080) translate(0 -228) scale(1.9)"/>
    <use href="#person" transform="translate(1230 1080) translate(0 -216) scale(1.8)"/>
    <use href="#person" transform="translate(1640 1080) translate(0 -204) scale(1.7)"/>
  </g>

  <!-- pessoas em primeiro plano com sacolas -->
  <g>
    <g fill="#fff" opacity="0.95">
      <use href="#person" transform="translate(70 1080) translate(0 -300) scale(2.5)"/>
    </g>
    <use href="#bagf" transform="translate(250 760) scale(1.7)"/>

    <g fill="#fff" opacity="0.95">
      <use href="#person" transform="translate(1430 1080) translate(0 -330) scale(2.75)"/>
    </g>
    <use href="#bagf" transform="translate(1650 790) scale(1.9)"/>

    <g fill="#dbe6ff" opacity="0.9">
      <use href="#person" transform="translate(1780 1080) translate(0 -270) scale(2.25)"/>
    </g>
  </g>

  <!-- chão -->
  <rect y="1070" width="1920" height="10" fill="#fff" opacity="0.18"/>
</svg>
